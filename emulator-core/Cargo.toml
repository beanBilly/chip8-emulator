[package]
name = "emulator-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib","rlib"]

[dependencies]
rand = "0.10.1"
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.2", features = ["wasm_js"] }
#minifb = "0.24.0"
#rodio = "0.22.2" 
backtrace = "0.3"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.24.0"
rodio = "0.22.2"
